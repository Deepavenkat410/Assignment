<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <style>
        .id-card {
            width: 350px;
            border: 2px solid #0d6efd;
            border-radius: 12px;
            overflow: hidden;
            margin: 50px auto;
        }

        .header {
            background: #0d6efd;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .student-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #0d6efd;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

<div class="id-card bg-white shadow">

    <div class="header">
        <h4>SLA</h4>
        <p class="mb-0">STUDENT ID CARD</p>
    </div>

    <div class="text-center p-3">
        <img src="https://via.placeholder.com/100"
             class="student-img" alt="Student Photo">

        <h5 class="mt-3">Student Name</h5>
        <p class="text-primary fw-bold">Student</p>
    </div>

    <div class="px-4 pb-3">
        <p><b>ID Number:</b> SLA001</p>
        <p><b>Department:</b> Computer Science</p>
        <p><b>Year:</b> 2026</p>
        <p><b>Email:</b> student@gmail.com</p>
    </div>

    <div class="bg-primary text-white text-center p-2">
        <small>Valid Student Identity Card</small>
    </div>

</div>

</body>
</html>
